<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | StudyMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top center, #1e293b 0%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: #f1f5f9;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    .notfound-container {
      width: 90%;
      max-width: 620px;
      padding: 48px 40px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(56, 189, 248, 0.15);
      position: relative;
      animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .brand-header {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      padding: 8px 18px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .error-code {
      font-size: 110px;
      font-weight: 800;
      line-height: 1;
      margin: 0;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
      filter: drop-shadow(0 4px 20px rgba(56, 189, 248, 0.3));
    }

    .error-illustration {
      font-size: 42px;
      margin: 16px 0;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }

    .error-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin: 12px 0 8px;
    }

    .error-desc {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      max-width: 460px;
      margin: 0 auto 32px;
    }

    .action-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      align-items: center;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 26px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .helpful-links {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 13px;
      color: #64748b;
    }

    .helpful-links a {
      color: #94a3b8;
      text-decoration: none;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .helpful-links a:hover {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="notfound-container">
    <div class="brand-header">
      <i class="fa-solid fa-graduation-cap"></i>
      <span>StudyMate Academic Hub</span>
    </div>

    <div class="error-code">404</div>
    <div class="error-illustration">
      <i class="fa-solid fa-compass fa-spin" style="--fa-animation-duration: 15s; color: #38bdf8;"></i>
    </div>

    <h1 class="error-title">Requested Page Not Found</h1>
    <p class="error-desc">
      The academic resource, study group route, or dashboard URL you were looking for seems to have been relocated or doesn't exist.
    </p>

    <div class="action-group">
      <a href="dashboard.html" class="btn-action btn-primary">
        <i class="fa-solid fa-table-columns"></i>
        <span>Go to Dashboard</span>
      </a>
      <a href="index.html" class="btn-action btn-secondary">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>Sign In / Register</span>
      </a>
      <button onclick="history.back()" class="btn-action btn-secondary">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Go Back</span>
      </button>
    </div>

    <div class="helpful-links">
      <a href="dashboard.html"><i class="fa-solid fa-user-group"></i> Find Study Partner</a>
      <a href="dashboard.html"><i class="fa-solid fa-book-open"></i> Study Library</a>
      <a href="dashboard.html"><i class="fa-solid fa-comments"></i> Chat Requests</a>
    </div>
  </div>

</body>
</html>
