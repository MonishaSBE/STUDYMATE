<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StudyMate — Find Your Study Partner</title>
<link rel="stylesheet" href="css/style.css" />
<style>
.auth-form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
.auth-form button { margin-top: 10px; }
.toggle-auth { font-size: 13px; color: var(--pin-teal); cursor: pointer; margin-top: 10px; display: inline-block; }
</style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <span class="eyebrow">// studymate</span>
      <h1>Find your study partner</h1>
      <p class="sub" id="authSub">Sign in to get matched with classmates.</p>
      
      <div id="signin">
        <form class="auth-form" id="loginForm">
          <input type="email" id="l_email" placeholder="Email" required />
          <input type="password" id="l_password" placeholder="Password" required />
          <button type="submit" class="btn">Sign In</button>
        </form>
        <span class="toggle-auth" onclick="toggleAuth()">Need an account? Register here.</span>
      </div>

      <div id="signup" style="display:none;">
        <form class="auth-form" id="registerForm">
          <input type="email" id="r_email" placeholder="Email" required />
          <input type="password" id="r_password" placeholder="Password" required />
          <button type="submit" class="btn">Register</button>
        </form>
        <span class="toggle-auth" onclick="toggleAuth()">Already have an account? Sign in.</span>
      </div>
    </div>
  </div>

  <script src="js/config/config.js"></script>
  <script src="js/auth/auth.js"></script>
</body>
</html>
